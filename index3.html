<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>東北大学付けチェック</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#111;
    color:white;
}

.container{
    max-width:600px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.question{
    text-align:center;
    font-size:2rem;
    margin:20px 0;
}

.choice{
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
    text-align:center;
}

.a{
    background:#1976d2;
}

.b{
    background:#d32f2f;
}

.label{
    font-size:2rem;
    font-weight:bold;
}

.text{
    font-size:1.5rem;
    margin-top:10px;
}

.image-placeholder{
    background:white;
    color:black;
    height:180px;
    margin-top:15px;
    border-radius:10px;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.buttons{
    display:flex;
    gap:10px;
}

button{
    flex:1;
    padding:15px;
    font-size:1rem;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

.prev-btn{
    background:#6c757d;
    color:white;
}

.list-btn{
    background:#ff9800;
    color:white;
}

.next-btn{
    background:#28a745;
    color:white;
}

.page{
    display:none;
}

.active{
    display:block;
}

.question-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.question-item{
    background:#333;
    padding:20px;
    border-radius:10px;
    text-align:center;
    cursor:pointer;
}

.question-item:hover{
    background:#555;
}
</style>
</head>

<body>

<div class="container">

    <div id="questionPage" class="page active">

        <div id="number" class="question"></div>

        <div class="choice a">
            <div class="label">A</div>
            <div id="textA" class="text"></div>
            <div id="imgA" class="image-placeholder" style="display:none;">
                写真A
            </div>
        </div>

        <div class="choice b">
            <div class="label">B</div>
            <div id="textB" class="text"></div>
            <div id="imgB" class="image-placeholder" style="display:none;">
                写真B
            </div>
        </div>

        <div class="buttons">
            <button class="prev-btn" onclick="prevQuestion()">
                ← 前へ
            </button>

            <button class="list-btn" onclick="showList()">
                問題一覧
            </button>

            <button class="next-btn" onclick="nextQuestion()">
                次へ →
            </button>
        </div>

    </div>

    <div id="listPage" class="page">

        <h1>問題一覧</h1>

        <div class="question-list" id="questionList"></div>

        <br>

        <button class="list-btn" onclick="backToQuestion()">
            戻る
        </button>

    </div>

</div>

<script>

const questions = [

{
    a:"",
    b:"",
    image:true
},

{
    a:"南北線",
    b:"東西線",
    image:false
},

{
    a:"",
    b:"",
    image:false
},

{
    a:"",
    b:"",
    image:true
},

{
    a:"トーマス・エジソン",
    b:"アルベルト・アインシュタイン",
    image:false
},

{
    a:"",
    b:"",
    image:false
},

{
    a:"",
    b:"",
    image:true
},

{
    a:"",
    b:"",
    image:false
},

{
    a:"",
    b:"",
    image:false
}

];

let current = 0;

function showQuestion(){

    document.getElementById("number").textContent =
        `第${current+1}問 / 9問`;

    document.getElementById("textA").textContent =
        questions[current].a;

    document.getElementById("textB").textContent =
        questions[current].b;

    if(questions[current].image){
        document.getElementById("imgA").style.display = "flex";
        document.getElementById("imgB").style.display = "flex";
    }else{
        document.getElementById("imgA").style.display = "none";
        document.getElementById("imgB").style.display = "none";
    }

    document.getElementById("questionPage")
        .classList.add("active");

    document.getElementById("listPage")
        .classList.remove("active");
}

function nextQuestion(){
    if(current < questions.length - 1){
        current++;
        showQuestion();
    }
}

function prevQuestion(){
    if(current > 0){
        current--;
        showQuestion();
    }
}

function showList(){

    const list =
        document.getElementById("questionList");

    list.innerHTML = "";

    for(let i = 0; i < questions.length; i++){

        const item =
            document.createElement("div");

        item.className = "question-item";
        item.textContent = `第${i+1}問`;

        item.onclick = function(){
            current = i;
            showQuestion();
        };

        list.appendChild(item);
    }

    document.getElementById("questionPage")
        .classList.remove("active");

    document.getElementById("listPage")
        .classList.add("active");
}

function backToQuestion(){
    showQuestion();
}

showQuestion();

</script>

</body>
</html>
